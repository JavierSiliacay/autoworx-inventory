name: Generate AI Changelog

on:
  push:
    branches:
      - main
      - master

jobs:
  ai_changelog:
    runs-on: ubuntu-latest
    
    # Critical: Prevent the AI from triggering itself in an infinite loop!
    if: "!contains(github.event.head_commit.message, 'chore: auto-generated AI changelog')"
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI Release Script (Read-Only AI mode)
        env:
          # Securely injects the key from GitHub without exposing it in the code
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node scripts/generate-release.js
          
      - name: Commit & Push Changelog update
        run: |
          # Set up the standard GitHub Action Bot identity
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if the AI actually generated a new changelog line
          if git diff --quiet src/data/changelog.ts; then
            echo "No new updates generated by AI."
          else
            # Since generate-release.js already staged the file, we just commit it
            git commit -m "chore: auto-generated AI changelog 🤖"
            git push
          fi
